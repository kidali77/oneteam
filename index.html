<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="KB Global One Team — 더 넓은 시각으로, 더 나은 오늘을 만듭니다.">
  <title>KB Global One Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #05060a;
      --panel: #0d1016;
      --line: rgba(255,255,255,.09);
      --gold: #f0b93c;
      --gold-hi: #f7d489;
      --ink: #ffffff;
      --ink-2: #b3bdca;
      --ink-3: #7d8794;
      --f-ko: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
      --f-en: 'Poppins', var(--f-ko);
      --nav-h: clamp(56px, 8.6vh, 76px);
      --pad: clamp(16px, 4.7vw, 72px);
      --ease: cubic-bezier(.22,.84,.2,1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
           font-family: var(--f-ko); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ── 내비 ─────────────────────────────────────────── */
    .nav { position: absolute; top: 0; left: 0; right: 0; z-index: 40; height: var(--nav-h);
           display: flex; align-items: center; padding: 0 var(--pad); }
    .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .brand svg { width: clamp(24px, 2.6vw, 34px); height: auto; aspect-ratio: 47/34;
                 color: var(--gold); display: block; }
    .brand b { font-family: var(--f-en); font-size: clamp(14px, 1.55vw, 21px);
               font-weight: 600; letter-spacing: -.012em; }
    .menu { display: flex; gap: clamp(20px, 4.4vw, 62px); margin: 0 auto; }
    .menu a { font-size: clamp(13px, 1.45vw, 19px); font-weight: 500; color: #dde3ea;
              transition: color .18s; white-space: nowrap; }
    .menu a:hover, .menu a:focus-visible { color: var(--ink); outline: none; }
    .navtools { display: flex; align-items: center; gap: clamp(2px, .6vw, 8px); margin-left: auto; }
    .navtools button { width: clamp(34px, 3.6vw, 46px); height: clamp(34px, 3.6vw, 46px); border-radius: 50%;
                       display: grid; place-items: center; color: var(--ink-2);
                       transition: background .18s, color .18s; }
    .navtools button:hover, .navtools button:focus-visible { background: rgba(255,255,255,.08); color: #fff; outline: none; }
    .navtools svg { width: clamp(17px, 1.85vw, 24px); height: clamp(17px, 1.85vw, 24px); fill: none; stroke: currentColor;
                    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .burger { display: none; }

    /* ── 히어로 ───────────────────────────────────────── */
    .hero { position: relative; min-height: 100vh; padding-top: var(--nav-h);
            display: flex; flex-direction: column; overflow: hidden; }
    .hero-globe { position: absolute; left: 100%; top: 77%;
                  width: 97%; aspect-ratio: 1;
                  transform: translate(-50%, -50%);
                  background: url("hero-globe-2026.webp") center/contain no-repeat;
                  pointer-events: none; }
    /* 지구 왼쪽 위로 번지는 빛 */
    .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
                    background: radial-gradient(46% 40% at 78% 12%, rgba(240,185,60,.13), transparent 72%); }
    /* 텍스트 쪽이 어둡도록 좌측을 눌러준다 */
    .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                   background: linear-gradient(90deg, var(--bg) 2%, rgba(5,6,10,.86) 26%, rgba(5,6,10,.34) 48%, transparent 64%); }

    .hero-copy { position: relative; z-index: 2; flex: 1;
                 display: flex; flex-direction: column; justify-content: center;
                 padding: clamp(20px, 4vh, 56px) var(--pad) 0 clamp(22px, 6.6vw, 100px);
                 max-width: min(780px, 62%); }
    .hero h1 { margin: 0; font-size: clamp(1.9rem, 4.45vw, 4rem); font-weight: 700;
               line-height: 1.14; letter-spacing: -.032em; }
    .hero p { margin: clamp(14px, 2.4vh, 26px) 0 0; font-size: clamp(.88rem, 1.63vw, 1.3rem);
              font-weight: 400; color: #cdd5de; letter-spacing: -.015em; }
    .cta { display: inline-flex; align-items: center; gap: 9px; align-self: flex-start;
           margin-top: clamp(24px, 4.4vh, 52px);
           padding: clamp(12px, 1.85vh, 19px) clamp(20px, 2.4vw, 32px);
           border-radius: 10px;
           background: linear-gradient(180deg, #fdeec4, #f2d290);
           color: #29200a; font-weight: 700; font-size: clamp(.86rem, 1.72vw, 1.32rem);
           letter-spacing: -.012em;
           box-shadow: 0 12px 34px rgba(240,185,60,.2);
           transition: transform .18s var(--ease), box-shadow .18s var(--ease); }
    .cta span { font-family: var(--f-en); }
    .cta:hover, .cta:focus-visible { transform: translateY(-2px);
                                     box-shadow: 0 14px 38px rgba(240,185,60,.34); outline: none; }
    .cta svg { width: clamp(15px, 1.5vw, 20px); height: clamp(15px, 1.5vw, 20px); fill: none; stroke: currentColor;
               stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── 카드 4장 ─────────────────────────────────────── */
    .cards { position: relative; z-index: 2;
             display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.76vw, 22px);
             padding: 0 var(--pad) 5.8vh; }
    .card { display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(10px, 1.8vh, 20px); min-height: clamp(88px, 23.6vh, 186px);
            padding: clamp(14px, 2vh, 26px) 10px;
            background: rgba(19,22,29,.82); border: 1px solid transparent; border-radius: 10px;
            backdrop-filter: blur(8px);
            transition: background .2s, border-color .2s, transform .2s var(--ease); }
    .card:hover, .card:focus-visible { background: rgba(24,28,37,.86);
                                       border-color: rgba(240,185,60,.34);
                                       transform: translateY(-3px); outline: none; }
    .card svg { width: clamp(21px, 3.3vw, 44px); height: clamp(21px, 3.3vw, 44px); fill: none; stroke: var(--gold-hi);
                stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .card b { font-size: clamp(.82rem, 1.95vw, 1.42rem); font-weight: 600; letter-spacing: -.015em; }

    /* ── 반응형 ───────────────────────────────────────── */
    @media (max-width: 900px) {
      .menu { display: none; }
      .burger { display: grid; }
      .hero-copy { max-width: 100%; }
      .hero-globe { left: 106%; top: 40%; width: 155%; opacity: .5; }
      .hero::after { background: linear-gradient(180deg, rgba(5,6,10,.5) 30%, var(--bg) 88%); }
      .cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .hero h1 { font-size: clamp(1.6rem, 8.2vw, 2.3rem); }
      .card { padding: 16px 8px; gap: 10px; }
      .card svg { width: 22px; height: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
