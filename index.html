    :root {
      /* ── 팔레트 (콘티 실측) ────────────────────────────── */
      --bg: #05060a;
      --gold: #f0b93c;
      --gold-hi: #f7d489;
      --gold-dim: #a8781f;
      --land: #090b10;
      --dot: #4e3810;
      --city: #dfa338;
      --ink: #ffffff;
      --ink-2: #b9c4d2;
      --ease: cubic-bezier(.22,.84,.2,1);

      /* ── 타임라인 (총 13초 · 콘티 6초 구성을 2.17배로) ── */
      --t-open:    .18s;   /* 01 오프닝 문구 */
      --t-openout: .92s;
      --t-map:    1.10s;   /* 02 지도 */
      --t-seoul:  1.35s;
      --t-cam1:   1.75s;   --t-s1: 1.95s;   /* 03 싱가포르 */
      --t-cam2:   2.55s;   --t-s2: 2.75s;   /* 04 하노이·자카르타 */
      --t-cam3:   3.45s;   --t-s3: 3.65s;   /* 05 런던·프놈펜 */
      --t-cam4:   4.35s;   --t-s4: 4.55s;   /* 06 뉴욕 */
      --t-dim:    6.10s;   /* 07 지도 감광 */
      --t-h1:     6.45s;
      --t-uline:  6.95s;
      --t-tag:    7.25s;
      --t-ko:     8.80s;   /* 08 */
      --t-sep:    9.45s;
      --t-unit:   9.85s;
      --t-out:   11.50s;   /* 09 전환 */
      --total:      13s;
      --dur-draw:  .8s;
      --dur-draw-l: 1.1s;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden;
                 background: var(--bg); color: var(--ink);
                 font-family: Pretendard, system-ui, sans-serif; }
    body { -webkit-font-smoothing: antialiased; }
    button { font: inherit; }

    .intro { position: fixed; inset: 0; isolation: isolate; background: var(--bg); }

    /* ── 01 오프닝 문구 ───────────────────────────────────── */
    .opening {
      position: absolute; inset: 0; z-index: 30;
      display: grid; place-items: center; text-align: center;
      color: #c7ced8; font-size: clamp(1.05rem, 2.3vw, 1.6rem);
      font-weight: 500; line-height: 1.62; letter-spacing: -.01em;
      opacity: 0; pointer-events: none;
      animation: open-in .55s var(--ease) var(--t-open) forwards,
                 open-out .5s var(--ease) var(--t-openout) forwards;
    }
    @keyframes open-in  { from { opacity: 0; transform: translateY(8px); }
                          to   { opacity: 1; transform: none; } }
    @keyframes open-out { to { opacity: 0; } }

    /* ── 지도 ─────────────────────────────────────────────── */
    .mapwrap { position: absolute; inset: 0; z-index: 5; overflow: hidden;
               opacity: 0; animation: fade-in 1s ease var(--t-map) forwards; }
    .worldmap { display: block; width: 100%; height: 100%; overflow: visible; }

    /* 07 에서 지도를 배경으로 낮춘다 (콘티 07·08 은 같은 지도의 감광 상태) */
    .mapdim { animation: map-dim 1.5s var(--ease) var(--t-dim) forwards; }
    @keyframes map-dim { to { opacity: .42; } }

    .cam {
      transform-box: view-box; transform-origin: 0 0;
      transform: translate(-3017.9px, -429.4px) scale(4.4337);
      animation: cam var(--total) var(--ease) forwards;
    }
    @keyframes cam {
      0%, 13.46% { transform: translate(-3017.9px, -429.4px) scale(4.4337); }
      18.08%, 19.62% { transform: translate(-1088.2px, -224.4px) scale(2.0863); }
      24.23%, 26.54% { transform: translate(-774.3px, -165.8px) scale(1.6853); }
      31.92%, 33.46% { transform: translate(-296.2px, -58.8px) scale(1.3142); }
      40.38%, 100% { transform: translate(0.0px, 0.0px) scale(1.0000); }
    }

    .land { fill: url(#dotGrid); }
    .landbase { fill: var(--land); }
    .city { fill: none; stroke: var(--city); stroke-linecap: round;
            vector-effect: non-scaling-stroke; }
    .city.s { stroke-width: 1.1; opacity: .5; }
    .city.m { stroke-width: 1.8; opacity: .72; }
    .city.l { stroke-width: 2.8; opacity: .92; }
    .layer-city { filter: url(#cityGlow); }

    /* ── 연결선 ───────────────────────────────────────────── */
    .route { --settle: calc(var(--delay) + var(--dur) - .12s); }
    .conn, .conn-glow { fill: none; stroke-linecap: round;
                        vector-effect: non-scaling-stroke; }
    .conn {
      stroke: var(--gold); stroke-width: 1.6;
      stroke-dasharray: var(--len, 900); stroke-dashoffset: var(--len, 900);
      opacity: 0;
      animation: draw var(--dur) var(--ease) var(--delay) forwards;
    }
    @keyframes draw { from { opacity: 1; } to { opacity: .92; stroke-dashoffset: 0; } }
    .conn-glow {
      stroke: var(--gold); stroke-width: 6; opacity: 0;
      animation: glow-in .5s ease var(--settle) forwards;
    }
    @keyframes glow-in { to { opacity: .13; } }

    /* ── 거점 ─────────────────────────────────────────────── */
    /* 마크는 카메라와 함께 커진다 (콘티 02번의 서울 HQ 가 그렇다).
       라벨만 .lbl 이 배율의 일부를 되돌려 글자가 화면을 넘지 않게 한다. */
    .pin { opacity: 0; animation: fade-in .5s ease var(--at) forwards; }
    .hq  { opacity: 0; animation: fade-in .55s ease var(--t-seoul) forwards; }
    .lbl { transform-box: view-box;
           animation: lbl-cam var(--total) var(--ease) forwards,
                      fade-out .8s ease var(--t-dim) forwards; }
    @keyframes lbl-cam {
      0%, 13.46% { transform: scale(0.4408); }
      18.08%, 19.62% { transform: scale(0.6673); }
      24.23%, 26.54% { transform: scale(0.7505); }
      31.92%, 33.46% { transform: scale(0.8605); }
      40.38%, 100% { transform: scale(1); }
    }
    .pin-dot { fill: var(--gold-hi); }
    .pin-halo { fill: none; stroke: var(--gold); stroke-width: 1; opacity: .5;
                vector-effect: non-scaling-stroke; }
    .pin-lbl { font-family: Poppins, system-ui, sans-serif; font-size: 10px;
               font-weight: 500; fill: #f2f6fb; }
    .pin-bg  { fill: rgba(6,8,13,.86); stroke: rgba(255,255,255,.2); stroke-width: .5;
               vector-effect: non-scaling-stroke; }

    /* 서울 — KB 심볼 + 소나 */
    .hq-ring { fill: none; stroke: var(--gold); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
    .hq-disc { fill: rgba(8,7,4,.72); }
    .sonar { fill: none; stroke: var(--gold); stroke-width: .9; vector-effect: non-scaling-stroke;
             transform-box: fill-box; transform-origin: center; opacity: 0;
             animation: sonar 3.4s ease-out var(--sd) infinite; }
    @keyframes sonar { 0% { opacity: .8; transform: scale(1); }
                       70% { opacity: .18; }
                       100% { opacity: 0; transform: scale(4.2); } }
    .hq-mark { color: var(--gold-hi); }
    .hq-lbl  { font-family: Poppins, system-ui, sans-serif; font-size: 13px;
               font-weight: 500; fill: #fff; }


    /* ── 07·08 문구 ───────────────────────────────────────── */
    .statement { position: absolute; inset: 0; z-index: 20;
                 display: flex; flex-direction: column; align-items: center;
                 justify-content: center; text-align: center; pointer-events: none;
                 padding: 0 24px; }
    .headline { margin: 0; font-family: Poppins, system-ui, sans-serif;
                font-size: clamp(2.1rem, 5.6vw, 4.4rem); font-weight: 600;
                letter-spacing: .045em; line-height: 1.06;
                background: linear-gradient(180deg, #fbe6b4, #e0a53a);
                -webkit-background-clip: text; background-clip: text; color: transparent;
                opacity: 0; transform: translateY(14px);
                animation: rise .9s var(--ease) var(--t-h1) forwards; }
    .uline { width: min(320px, 52vw); height: 1px; margin: 18px 0 0;
             background: linear-gradient(90deg, transparent, var(--gold), transparent);
             opacity: 0;
             animation: fade-in .6s ease var(--t-uline) forwards,
                        fade-out .6s ease var(--t-ko) forwards; }
    .ko-line { margin: 0; font-size: clamp(1.05rem, 2.5vw, 1.75rem); font-weight: 600;
               letter-spacing: -.01em; color: var(--ink);
               max-height: 0; opacity: 0; overflow: hidden;
               animation: ko-in .8s var(--ease) var(--t-ko) forwards; }
    @keyframes ko-in { to { max-height: 3em; opacity: 1; margin-top: 16px; } }
    .tagline { margin: 14px 0 0; font-family: Poppins, system-ui, sans-serif;
               font-size: clamp(.86rem, 1.55vw, 1.08rem); font-weight: 400;
               color: #eef3f9; opacity: 0;
               animation: fade-in .7s ease var(--t-tag) forwards; }
    .sep { position: relative; width: min(430px, 68vw); height: 1px; margin: 30px 0 0;
           background: linear-gradient(90deg, transparent, rgba(233,196,110,.42), transparent);
           opacity: 0; animation: fade-in .6s ease var(--t-sep) forwards; }
    .sep::after { content: ""; position: absolute; left: 50%; top: -1px;
                  width: 34px; height: 3px; border-radius: 2px;
                  transform: translateX(-50%); background: var(--gold-hi); }
    .unit { margin: 26px 0 0; font-size: clamp(.95rem, 2vw, 1.24rem); font-weight: 500;
            color: var(--ink); opacity: 0; transform: translateY(10px);
            animation: rise .8s var(--ease) var(--t-unit) forwards; }

    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes fade-out { to { opacity: 0; } }

    /* ── 09 전환 ──────────────────────────────────────────── */
    .intro { animation: intro-out .9s var(--ease) var(--t-out) forwards; }
    @keyframes intro-out { to { opacity: 0; visibility: hidden; } }

    /* ── SKIP · 검토 (콘티엔 없으나 접근성/검토용) ─────────── */
    .skip { position: fixed; z-index: 60; top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            min-height: 40px; padding: 0 16px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.16); background: rgba(10,12,18,.5);
            color: rgba(232,238,246,.75); font-family: Poppins, sans-serif;
            font-size: .7rem; font-weight: 500; letter-spacing: .1em;
            cursor: pointer; backdrop-filter: blur(10px);
            transition: color .2s, border-color .2s; }
    .skip:hover, .skip:focus-visible { color: #fff; border-color: rgba(240,185,60,.6); outline: none; }

    @media (max-width: 700px) {
      .statement { padding: 0 20px; }
      .headline { letter-spacing: .03em; }
      .pin-lbl { font-size: 11px; }
      .hq-lbl { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important;
                               animation-delay: 0ms !important;
                               animation-iteration-count: 1 !important; }
      .opening { display: none; }
      .mapwrap, .pin, .hq, .conn, .headline, .tagline, .ko-line, .sep, .unit { opacity: 1; }
      .ko-line { max-height: 3em; }
      .cam { transform: none; }
    }
  </style>
</head>
<body>
  <main class="intro">
    <!-- 01 -->
    <p class="opening">더 넓은 시각이<br>더 나은 오늘을 만듭니다.</p>

    <!-- 02~06 -->
    <div class="mapwrap">
      <svg class="worldmap mapdim" viewBox="189.9 36.6 708.5 301.5" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <pattern id="dotGrid" width="2.3" height="2.3" patternUnits="userSpaceOnUse">
            <circle cx="1.15" cy="1.15" r=".38" fill="var(--dot)"/>
          </pattern>
          <filter id="cityGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.1" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="hqGlow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

  <script>
    (() => {
      const SVG = 'http://www.w3.org/2000/svg';
      const HUBS = [{"id":"seoul","label":"Seoul HQ","stage":0,"x":803.4,"y":139.1},{"id":"sg","label":"Singapore","stage":1,"x":761.3,"y":255.6},{"id":"hanoi","label":"Hanoi","stage":2,"x":761.6,"y":192.1},{"id":"jkt","label":"Jakarta","stage":2,"x":769.1,"y":280},{"id":"ldn","label":"London","stage":3,"x":475.5,"y":94.6},{"id":"pnh","label":"Phnom Penh","stage":3,"x":762.7,"y":222.7},{"id":"nyc","label":"New York","stage":4,"x":284.9,"y":129}];
      /* 서울에서 뻗는 곡선. 동남아 4개가 거의 일직선이라 좌·우로 번갈아 부풀린다. */
      const CTRL = { sg: [700, 220], hanoi: [735, 170], jkt: [860, 230],
                     pnh: [838, 190], ldn: [650, 60], nyc: [540, 25] };
      const STAGE_VAR = { 1: '--t-s1', 2: '--t-s2', 3: '--t-s3', 4: '--t-s4' };

      const seoul = HUBS.find(h => h.stage === 0);
      const routes = document.querySelector('.routes');
      const pins = document.querySelector('.pins');

      const mk = (t, cls, attrs) => {
        const e = document.createElementNS(SVG, t);
        if (cls) e.setAttribute('class', cls);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      };

      /* ── 노선 ── */
      HUBS.filter(h => h.stage > 0).forEach(h => {
        const c = CTRL[h.id];
        const d = `M${seoul.x},${seoul.y} Q${c[0]},${c[1]} ${h.x},${h.y}`;
        const g = mk('g', 'route');
        g.style.setProperty('--delay', `var(${STAGE_VAR[h.stage]})`);
        g.style.setProperty('--dur', h.stage === 4 ? 'var(--dur-draw-l)' : 'var(--dur-draw)');
        const glow = mk('path', 'conn-glow', { d });
        const line = mk('path', 'conn', { d });
        g.append(glow, line);
        routes.appendChild(g);
        g.style.setProperty('--len', line.getTotalLength().toFixed(1));
      });

      /* ── 거점 핀 + 라벨 (절대 좌표) ── */
      HUBS.filter(h => h.stage > 0).forEach(h => {
        const g = mk('g', 'pin');
        g.style.transformOrigin = `${h.x}px ${h.y}px`;
        g.style.setProperty('--at', `calc(var(${STAGE_VAR[h.stage]}) + .55s)`);
        g.append(mk('circle', 'pin-halo', { cx: h.x, cy: h.y, r: 5.5 }),
                 mk('circle', 'pin-dot',  { cx: h.x, cy: h.y, r: 2.2 }));
        const lb = mk('g', 'lbl');
        lb.style.transformOrigin = `${h.x}px ${h.y}px`;
        const t = mk('text', 'pin-lbl', { x: h.x + 13, y: h.y + 3.4 });
        t.textContent = h.label;
        lb.appendChild(t);
        g.appendChild(lb);
        pins.appendChild(g);
      });

      /* ── 서울 HQ (절대 좌표) ── */
      const hq = mk('g', 'hq');
      hq.style.transformOrigin = `${seoul.x}px ${seoul.y}px`;
      [0, .85, 1.7, 2.55].forEach(d => {
        const c = mk('circle', 'sonar', { cx: seoul.x, cy: seoul.y, r: 12 });
        c.style.setProperty('--sd', `calc(var(--t-seoul) + ${d}s)`);
        hq.appendChild(c);
      });
      hq.append(mk('circle', 'hq-disc', { cx: seoul.x, cy: seoul.y, r: 12 }),
                mk('circle', 'hq-ring', { cx: seoul.x, cy: seoul.y, r: 12 }));
      const use = mk('use', 'hq-mark', { href: '#kb', x: seoul.x - 8.3, y: seoul.y - 6, width: 16.6, height: 12 });
      use.setAttribute('filter', 'url(#hqGlow)');
      hq.appendChild(use);
      const hlb = mk('g', 'lbl');
      hlb.style.transformOrigin = `${seoul.x}px ${seoul.y}px`;
      const ht = mk('text', 'hq-lbl', { x: seoul.x + 22, y: seoul.y + 4.6 });
      ht.textContent = seoul.label;
      hlb.appendChild(ht);
      hq.appendChild(hlb);
      pins.appendChild(hq);

      /* ── 라벨 배경 알약 (글자 폭을 재서 뒤에 깐다) ── */
      const pill = () => {
        document.querySelectorAll('.pin-bg').forEach(e => e.remove());
        document.querySelectorAll('.pin-lbl').forEach(t => {
          const b = t.getBBox(), px = 4, py = 2.6;
          const r = mk('rect', 'pin-bg', {
            x: (b.x - px).toFixed(1), y: (b.y - py).toFixed(1),
            width: (b.width + px * 2).toFixed(1), height: (b.height + py * 2).toFixed(1),
            rx: ((b.height + py * 2) / 2).toFixed(1)
          });
          t.parentNode.insertBefore(r, t);
        });
      };
      pill();
      addEventListener('resize', pill, { passive: true });

      /* ── 이동 ── */
      const TARGET = 'index.html';
      const TOTAL = 13000;
      let done = false;
      const go = () => { if (done) return; done = true; location.href = TARGET; };
      document.querySelector('.skip').addEventListener('click', go);
      addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') go(); });
      setTimeout(go, TOTAL);
    })();
  </script>
</body>
</html>
